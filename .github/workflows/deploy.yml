# Publishes CashFlow Lite to Firebase Hosting (project cashflow-lite-75a83).
#
# Inert until the repository has a FIREBASE_SERVICE_ACCOUNT secret:
# Firebase console → Project settings → Service accounts → Generate new private
# key, then paste the whole JSON file into
# Settings → Secrets and variables → Actions → New repository secret.
#
# Runs on a push to main, or on demand from the Actions tab against any branch.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cashflow-lite-75a83
          channelId: live
